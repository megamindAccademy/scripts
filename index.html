<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل سكريبتات الكورسات | Mega Minds Academy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'Tahoma', 'Arial', 'sans-serif'],
                        en: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', Tahoma, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .en-name {
            font-family: 'Inter', 'Cairo', sans-serif;
            direction: ltr;
            unicode-bidi: isolate;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.32);
        }
        .script-body {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.9;
        }
        @keyframes pulse-once {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .copied-pop {
            animation: pulse-once 0.25s ease-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-orange-500 selection:text-white">

    <!-- Mobile Backdrop -->
    <div id="mobile-backdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-30 hidden lg:hidden" onclick="toggleSidebar(false)"></div>

    <div class="flex min-h-screen">
        <!-- Sticky Sidebar (Right side in RTL) -->
        <aside id="sidebar" class="fixed lg:sticky top-0 right-0 z-40 h-screen w-80 xl:w-[340px] shrink-0 bg-slate-950 text-white flex flex-col border-l border-slate-800 shadow-2xl lg:shadow-none translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out">
            <!-- Brand Header -->
            <div class="p-4 border-b border-slate-800/90 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center font-black text-lg text-white shadow-lg shadow-orange-500/25 shrink-0">
                        M
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-sm font-extrabold tracking-tight text-white truncate">Mega Minds Academy</h1>
                        <p class="text-[11px] text-slate-400 font-medium truncate">مكتبة سكريبتات الكورسات</p>
                    </div>
                </div>
                <button type="button" onclick="toggleSidebar(false)" class="lg:hidden w-8 h-8 rounded-lg bg-slate-800/80 text-slate-300 hover:text-white flex items-center justify-center text-sm" aria-label="إغلاق القائمة">
                    ✕
                </button>
            </div>

            <!-- Progress & Search -->
            <div class="p-3.5 border-b border-slate-800/80 space-y-3 bg-slate-900/40">
                <!-- Progress Summary -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 flex items-center justify-between text-xs">
                    <span class="text-slate-300 font-semibold">السكريبتات الجاهزة</span>
                    <div class="flex items-center gap-2">
                        <span id="sidebar-added-count" class="font-extrabold text-orange-400 tabular-nums">0 / 25</span>
                    </div>
                </div>

                <!-- Search Input -->
                <div class="relative">
                    <input
                        id="search-input"
                        type="text"
                        placeholder="ابحثي باسم الكورس أو داخل السكريبت..."
                        class="w-full bg-slate-900 border border-slate-700/80 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 rounded-xl py-2 pr-9 pl-8 text-xs text-white placeholder-slate-400 outline-none transition"
                    >
                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none">🔍</span>
                    <button
                        id="clear-search-btn"
                        type="button"
                        onclick="clearSearch()"
                        class="hidden absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs w-5 h-5 rounded-full hover:bg-slate-800 items-center justify-center"
                        title="مسح البحث"
                    >
                        ✕
                    </button>
                </div>

                <!-- Filter Tabs -->
                <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800" role="tablist" aria-label="تصفية الكورسات">
                    <button type="button" data-filter="all" class="filter-tab px-1.5 py-1.5 rounded-lg text-[11px] font-bold transition text-center">
                        الكل <span class="opacity-75">(25)</span>
                    </button>
                    <button type="button" data-filter="Junior" class="filter-tab px-1.5 py-1.5 rounded-lg text-[11px] font-bold transition text-center">
                        Junior <span class="opacity-75">(7)</span>
                    </button>
                    <button type="button" data-filter="Senior" class="filter-tab px-1.5 py-1.5 rounded-lg text-[11px] font-bold transition text-center">
                        Senior <span class="opacity-75">(18)</span>
                    </button>
                    <button type="button" data-filter="filled" class="filter-tab px-1.5 py-1.5 rounded-lg text-[11px] font-bold transition text-center">
                        المُضاف <span id="filter-filled-count" class="opacity-75">(0)</span>
                    </button>
                </div>
            </div>

            <!-- Courses List -->
            <nav id="course-list" class="flex-1 overflow-y-auto custom-scrollbar sidebar-scroll p-2.5 space-y-1" aria-label="قائمة الكورسات">
                <!-- Populated by JS -->
            </nav>

            <!-- Sidebar Footer -->
            <div class="p-3 border-t border-slate-800/80 bg-slate-900/50 flex items-center justify-between text-[11px] text-slate-400">
                <span>التنقل بالأسهم ↑ ↓</span>
                <a href="./index.html" class="text-orange-400 hover:text-orange-300 font-bold flex items-center gap-1 transition">
                    <span>⬅</span> لوحة المهام
                </a>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="flex-1 min-w-0 flex flex-col">
            <!-- Top Navigation Bar -->
            <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <button
                        type="button"
                        onclick="toggleSidebar(true)"
                        class="lg:hidden w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-lg font-bold transition shrink-0"
                        aria-label="فتح قائمة الكورسات"
                    >
                        ☰
                    </button>
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 text-xs text-slate-500 font-semibold">
                            <span>دليل السكريبتات</span>
                            <span>/</span>
                            <span id="topbar-course-name" class="en-name text-slate-900 font-bold truncate">Coding.J.</span>
                        </div>
                    </div>
                </div>

                <!-- Previous / Next Course Controls -->
                <div class="flex items-center gap-2 shrink-0">
                    <button
                        id="prev-course-btn"
                        type="button"
                        onclick="navigateCourse(-1)"
                        class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center gap-1.5 disabled:opacity-40 disabled:pointer-events-none transition shadow-2xs"
                        title="الكورس السابق (السهم الأعلى)"
                    >
                        <span>→</span>
                        <span class="hidden sm:inline">السابق</span>
                    </button>
                    <span id="course-position-badge" class="text-xs font-bold text-slate-500 px-2 tabular-nums">1 / 25</span>
                    <button
                        id="next-course-btn"
                        type="button"
                        onclick="navigateCourse(1)"
                        class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center gap-1.5 disabled:opacity-40 disabled:pointer-events-none transition shadow-2xs"
                        title="الكورس التالي (السهم الأسفل)"
                    >
                        <span class="hidden sm:inline">التالي</span>
                        <span>←</span>
                    </button>
                </div>
            </header>

            <!-- Main Content Container -->
            <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
                <!-- Course Header Card -->
                <section class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 sm:p-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="space-y-2.5 min-w-0">
                            <div class="flex flex-wrap items-center gap-2">
                                <span id="course-index-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-extrabold font-mono">
                                    #01
                                </span>
                                <span id="course-stage-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold">
                                    Junior
                                </span>
                                <span id="course-track-badge" class="hidden items-center px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs font-bold">
                                    Robotics
                                </span>
                                <span id="course-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold">
                                    <!-- Filled by JS -->
                                </span>
                            </div>

                            <h2 id="course-title" class="en-name text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight break-words">
                                Coding.J.
                            </h2>
                        </div>

                        <!-- Primary Action Buttons -->
                        <div class="flex flex-wrap items-center gap-2.5 shrink-0">
                            <button
                                id="header-edit-btn"
                                type="button"
                                onclick="toggleEditor()"
                                class="px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs sm:text-sm font-bold flex items-center gap-2 transition"
                            >
                                <span>✏️</span>
                                <span id="header-edit-label">إضافة / تعديل سكريبت</span>
                            </button>

                            <button
                                id="header-copy-btn"
                                type="button"
                                onclick="copyCurrentScript(this)"
                                class="px-5 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white text-xs sm:text-sm font-extrabold flex items-center gap-2 shadow-sm shadow-orange-600/20 disabled:opacity-45 disabled:cursor-not-allowed transition"
                            >
                                <span class="copy-icon">📋</span>
                                <span class="copy-label">نسخ السكريبت</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Quick Inline Editor Card (Hidden by default) -->
                <section id="editor-card" class="hidden bg-white rounded-2xl border-2 border-orange-300 shadow-sm overflow-hidden">
                    <div class="px-5 py-3.5 bg-orange-50/70 border-b border-orange-200/80 flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <span class="text-base">✏️</span>
                            <h3 class="text-sm font-extrabold text-slate-900">تعديل / إضافة سكريبت الكورس</h3>
                            <span class="text-[11px] text-slate-500 font-medium hidden sm:inline">(يُحفظ محلياً في المتصفح فوراً)</span>
                        </div>
                        <button type="button" onclick="toggleEditor(false)" class="text-xs font-bold text-slate-500 hover:text-slate-800 px-2 py-1 rounded-lg hover:bg-white/80 transition">
                            إغلاق ✕
                        </button>
                    </div>
                    <div class="p-5 space-y-4">
                        <textarea
                            id="script-editor-input"
                            rows="10"
                            dir="auto"
                            placeholder="الصقي هنا نص السكريبت الخاص بهذا الكورس..."
                            class="w-full rounded-xl border border-slate-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 p-4 text-sm leading-relaxed text-slate-800 bg-slate-50/50 outline-none resize-y"
                        ></textarea>
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center gap-2 text-xs text-slate-500">
                                <span id="editor-stats">0 حرف • 0 كلمة</span>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <button
                                    id="reset-script-btn"
                                    type="button"
                                    onclick="resetLocalScript()"
                                    class="hidden px-3.5 py-2 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold transition"
                                >
                                    مسح التعديل المحلي
                                </button>
                                <button
                                    type="button"
                                    onclick="toggleEditor(false)"
                                    class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition"
                                >
                                    إلغاء
                                </button>
                                <button
                                    type="button"
                                    onclick="saveEditedScript()"
                                    class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-xs transition"
                                >
                                    <span>💾</span> حفظ السكريبت
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Script Display Card -->
                <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <!-- Script Card Toolbar -->
                    <div class="px-5 py-3.5 bg-slate-50/90 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                                <span>📄</span> محتوى السكريبت
                            </span>
                            <span id="script-meta-stats" class="text-xs font-semibold text-slate-500 bg-white px-2.5 py-0.5 rounded-full border border-slate-200">
                                فارغ
                            </span>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <!-- Text Direction Toggle -->
                            <div class="inline-flex items-center bg-white border border-slate-200 rounded-xl p-0.5 text-[11px] font-bold" role="group" aria-label="اتجاه النص">
                                <button type="button" data-dir="auto" onclick="setScriptDir('auto')" class="dir-btn px-2.5 py-1 rounded-lg transition">تلقائي</button>
                                <button type="button" data-dir="rtl" onclick="setScriptDir('rtl')" class="dir-btn px-2.5 py-1 rounded-lg transition">RTL</button>
                                <button type="button" data-dir="ltr" onclick="setScriptDir('ltr')" class="dir-btn px-2.5 py-1 rounded-lg transition">LTR</button>
                            </div>

                            <!-- Card Copy Button -->
                            <button
                                id="card-copy-btn"
                                type="button"
                                onclick="copyCurrentScript(this)"
                                class="px-3.5 py-1.5 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 text-xs font-extrabold flex items-center gap-1.5 disabled:opacity-45 disabled:cursor-not-allowed transition"
                            >
                                <span class="copy-icon">📋</span>
                                <span class="copy-label">نسخ</span>
                            </button>
                        </div>
                    </div>

                    <!-- Script Content Body or Empty Placeholder -->
                    <div id="script-view-container" class="p-5 sm:p-7 min-h-[340px]">
                        <!-- Populated by JS -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Floating Toast -->
    <div id="toast" role="status" aria-live="polite" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl border border-slate-700/80 text-xs sm:text-sm font-bold flex items-center gap-2 transition-all duration-200">
        <span id="toast-message">تم النسخ! ✅</span>
    </div>

    <script>
        /**
         * قائمة الكورسات الـ 25 بنفس الترتيب المطلوب تماماً.
         * لإضافة سكريبت بشكل دائم داخل الملف، ضع النص داخل حقل `script` بين علامتي `...`.
         */
        const COURSES_DATA = [
            { id: 1,  name: "Coding.J.",              stage: "Junior", track: "",         script: "" },
            { id: 2,  name: "Coding & AI.J.",         stage: "Junior", track: "",         script: "" },
            { id: 3,  name: "Mobile App.J.",          stage: "Junior", track: "",         script: "" },
            { id: 4,  name: "3D & XR Studio.J.",      stage: "Junior", track: "",         script: "" },
            { id: 5,  name: "Python.J.",              stage: "Junior", track: "",         script: "" },
            { id: 6,  name: "Mobile App.",            stage: "Senior", track: "",         script: "" },
            { id: 7,  name: "Python.",                stage: "Senior", track: "",         script: "" },
            { id: 8,  name: "Problem Solving.",       stage: "Senior", track: "",         script: "" },
            { id: 9,  name: "AI & Machine Learning.", stage: "Senior", track: "",         script: "" },
            { id: 10, name: "Godot",                  stage: "Senior", track: "",         script: "" },
            { id: 11, name: "Cyber Security.",        stage: "Senior", track: "",         script: "" },
            { id: 12, name: "Network & Hacking.",     stage: "Senior", track: "",         script: "" },
            { id: 13, name: "Unity.",                 stage: "Senior", track: "",         script: "" },
            { id: 14, name: "UI & UX.",               stage: "Senior", track: "",         script: "" },
            { id: 15, name: "Web Design.",            stage: "Senior", track: "",         script: "" },
            { id: 16, name: "Web Advanced.",          stage: "Senior", track: "",         script: "" },
            { id: 17, name: "React JS.",              stage: "Senior", track: "",         script: "" },
            { id: 18, name: "Back-End Web.",          stage: "Senior", track: "",         script: "" },
            { id: 19, name: "Flutter.",               stage: "Senior", track: "",         script: "" },
            { id: 20, name: "Back-End Mobile.",       stage: "Senior", track: "",         script: "" },
            { id: 21, name: "Mega Explorers.J.",      stage: "Junior", track: "Robotics", script: "" },
            { id: 22, name: "Mega Inventors.J.",      stage: "Junior", track: "Robotics", script: "" },
            { id: 23, name: "Robo Masters.",          stage: "Senior", track: "Robotics", script: "" },
            { id: 24, name: "Smart Home.",            stage: "Senior", track: "Robotics", script: "" },
            { id: 25, name: "Smart City.",            stage: "Senior", track: "Robotics", script: "" }
        ];

        const STORAGE_KEY_SCRIPTS = "megaminds_course_scripts_overrides_v1";
        const STORAGE_KEY_DIR = "megaminds_course_scripts_dir_v1";

        let state = {
            selectedId: 1,
            filter: "all",
            search: "",
            scriptDir: localStorage.getItem(STORAGE_KEY_DIR) || "auto",
            editorOpen: false,
            localOverrides: loadOverrides()
        };

        let toastTimer = null;

        function loadOverrides() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_SCRIPTS);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        function saveOverrides() {
            try {
                localStorage.setItem(STORAGE_KEY_SCRIPTS, JSON.stringify(state.localOverrides));
            } catch (e) {
                showToast("تعذر الحفظ في ذاكرة المتصفح");
            }
        }

        function getEffectiveScript(course) {
            if (Object.prototype.hasOwnProperty.call(state.localOverrides, course.id)) {
                return state.localOverrides[course.id];
            }
            return course.script || "";
        }

        function hasScript(course) {
            return getEffectiveScript(course).trim().length > 0;
        }

        function getFilteredCourses() {
            const q = state.search.trim().toLowerCase();
            return COURSES_DATA.filter(course => {
                if (state.filter === "Junior" && course.stage !== "Junior") return false;
                if (state.filter === "Senior" && course.stage !== "Senior") return false;
                if (state.filter === "filled" && !hasScript(course)) return false;

                if (q) {
                    const nameMatch = course.name.toLowerCase().includes(q);
                    const scriptMatch = getEffectiveScript(course).toLowerCase().includes(q);
                    const trackMatch = course.track && course.track.toLowerCase().includes(q);
                    return nameMatch || scriptMatch || trackMatch;
                }
                return true;
            });
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatIndex(num) {
            return String(num).padStart(2, "0");
        }

        function getStats(text) {
            const trimmed = text.trim();
            if (!trimmed) return { chars: 0, words: 0, lines: 0 };
            const chars = trimmed.length;
            const words = trimmed.split(/\s+/).filter(Boolean).length;
            const lines = trimmed.split(/\r?\n/).length;
            return { chars, words, lines };
        }

        function renderAll() {
            renderCounters();
            renderFilterTabs();
            renderSidebarList();
            renderMainView();
            renderDirButtons();
        }

        function renderCounters() {
            const filledCount = COURSES_DATA.filter(hasScript).length;
            document.getElementById("sidebar-added-count").textContent = `${filledCount} / ${COURSES_DATA.length}`;
            document.getElementById("filter-filled-count").textContent = `(${filledCount})`;
        }

        function renderFilterTabs() {
            document.querySelectorAll(".filter-tab").forEach(btn => {
                const isActive = btn.dataset.filter === state.filter;
                if (isActive) {
                    btn.className = "filter-tab px-1.5 py-1.5 rounded-lg text-[11px] font-extrabold transition text-center bg-orange-600 text-white shadow-xs";
                } else {
                    btn.className = "filter-tab px-1.5 py-1.5 rounded-lg text-[11px] font-bold transition text-center text-slate-400 hover:text-white hover:bg-slate-800/80";
                }
            });
        }

        function renderSidebarList() {
            const container = document.getElementById("course-list");
            const filtered = getFilteredCourses();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="py-10 px-4 text-center space-y-2">
                        <div class="text-2xl">🔎</div>
                        <p class="text-xs font-bold text-slate-300">لا توجد كورسات مطابقة</p>
                        <p class="text-[11px] text-slate-500">جرّبي مسح البحث أو تغيير الفلتر</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(course => {
                const isSelected = course.id === state.selectedId;
                const filled = hasScript(course);
                const dotClass = filled
                    ? "bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.65)]"
                    : "bg-slate-600";

                const stageBadge = course.stage === "Junior"
                    ? "bg-amber-500/15 text-amber-300 border-amber-500/25"
                    : "bg-sky-500/15 text-sky-300 border-sky-500/25";

                const rowClasses = isSelected
                    ? "bg-gradient-to-l from-orange-600/25 to-orange-500/10 border-orange-500/60 text-white shadow-xs"
                    : "border-transparent text-slate-300 hover:bg-slate-900 hover:text-white";

                const numClasses = isSelected
                    ? "bg-orange-500 text-white"
                    : "bg-slate-800/90 text-slate-400 group-hover:text-slate-200";

                return `
                    <button
                        type="button"
                        data-course-id="${course.id}"
                        onclick="selectCourse(${course.id})"
                        class="course-item group w-full text-right flex items-center justify-between gap-2.5 px-2.5 py-2.5 rounded-xl border transition ${rowClasses}"
                    >
                        <div class="flex items-center gap-2.5 min-w-0">
                            <span class="w-6 h-6 rounded-lg text-[10px] font-mono font-bold flex items-center justify-center shrink-0 transition ${numClasses}">
                                ${formatIndex(course.id)}
                            </span>
                            <span class="en-name text-[13px] font-semibold truncate">${escapeHtml(course.name)}</span>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold border ${stageBadge}">
                                ${course.stage}
                            </span>
                            <span class="w-2 h-2 rounded-full ${dotClass}" title="${filled ? 'تم إضافة السكريبت' : 'بانتظار السكريبت'}"></span>
                        </div>
                    </button>
                `;
            }).join("");
        }

        function renderMainView() {
            const course = COURSES_DATA.find(c => c.id === state.selectedId) || COURSES_DATA[0];
            const scriptText = getEffectiveScript(course);
            const filled = scriptText.trim().length > 0;
            const hasLocalOverride = Object.prototype.hasOwnProperty.call(state.localOverrides, course.id);

            // Topbar & position controls
            document.getElementById("topbar-course-name").textContent = course.name;

            const filtered = getFilteredCourses();
            const currentPosInFiltered = filtered.findIndex(c => c.id === course.id);
            const navList = currentPosInFiltered !== -1 ? filtered : COURSES_DATA;
            const navIndex = currentPosInFiltered !== -1 ? currentPosInFiltered : COURSES_DATA.findIndex(c => c.id === course.id);

            document.getElementById("course-position-badge").textContent = `${navIndex + 1} / ${navList.length}`;
            document.getElementById("prev-course-btn").disabled = navIndex <= 0;
            document.getElementById("next-course-btn").disabled = navIndex >= navList.length - 1;

            // Header card details
            document.getElementById("course-index-badge").textContent = `#${formatIndex(course.id)}`;
            document.getElementById("course-title").textContent = course.name;

            const stageBadgeEl = document.getElementById("course-stage-badge");
            stageBadgeEl.textContent = course.stage;
            stageBadgeEl.className = course.stage === "Junior"
                ? "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 border border-amber-200"
                : "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-sky-100 text-sky-800 border border-sky-200";

            const trackBadgeEl = document.getElementById("course-track-badge");
            if (course.track) {
                trackBadgeEl.textContent = `🤖 ${course.track}`;
                trackBadgeEl.className = "inline-flex items-center px-2.5 py-0.5 rounded-full bg-violet-100 text-violet-800 border border-violet-200 text-xs font-bold";
            } else {
                trackBadgeEl.className = "hidden";
            }

            const statusBadgeEl = document.getElementById("course-status-badge");
            if (filled) {
                statusBadgeEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> جاهز للنسخ`;
                statusBadgeEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
            } else {
                statusBadgeEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> بانتظار إضافة السكريبت`;
                statusBadgeEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200";
            }

            // Copy buttons state
            const headerCopyBtn = document.getElementById("header-copy-btn");
            const cardCopyBtn = document.getElementById("card-copy-btn");
            headerCopyBtn.disabled = !filled;
            cardCopyBtn.disabled = !filled;

            // Edit button label
            document.getElementById("header-edit-label").textContent = filled ? "تعديل السكريبت" : "إضافة سكريبت";

            // Script stats
            const stats = getStats(scriptText);
            const statsEl = document.getElementById("script-meta-stats");
            if (filled) {
                statsEl.textContent = `${stats.words} كلمة • ${stats.chars} حرف`;
                statsEl.className = "text-xs font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200";
            } else {
                statsEl.textContent = "فارغ";
                statsEl.className = "text-xs font-semibold text-slate-500 bg-white px-2.5 py-0.5 rounded-full border border-slate-200";
            }

            // Script content view
            const viewContainer = document.getElementById("script-view-container");
            if (filled) {
                viewContainer.innerHTML = `
                    <div id="script-text-box" dir="${state.scriptDir}" class="script-body text-slate-800 text-[15px] sm:text-base bg-slate-50/70 border border-slate-200/80 rounded-2xl p-5 sm:p-6 select-all">${escapeHtml(scriptText)}</div>
                    ${hasLocalOverride ? `<p class="mt-3 text-[11px] text-slate-400 font-medium flex items-center gap-1.5"><span>💾</span> محفوظ محلياً على هذا المتصفح.</p>` : ""}
                `;
            } else {
                viewContainer.innerHTML = `
                    <div class="h-full min-h-[260px] rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50/60 flex flex-col items-center justify-center text-center p-6 sm:p-10 space-y-4">
                        <div class="w-14 h-14 rounded-2xl bg-orange-50 border border-orange-200/80 text-orange-600 flex items-center justify-center text-2xl">
                            📝
                        </div>
                        <div class="space-y-1.5 max-w-md">
                            <h4 class="text-base font-extrabold text-slate-800">
                                لا يوجد سكريبت مضاف لـ <span class="en-name text-orange-600">${escapeHtml(course.name)}</span> حتى الآن
                            </h4>
                            <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
                                يمكنكِ إرسال السكريبت الخاص بهذا الكورس لإضافته بشكل دائم هنا، أو الضغط على الزر بالأسفل للصق السكريبت وحفظه فوراً.
                            </p>
                        </div>
                        <button
                            type="button"
                            onclick="toggleEditor(true)"
                            class="px-4 py-2.5 rounded-xl bg-white hover:bg-orange-50 text-orange-700 border border-orange-200 text-xs font-extrabold flex items-center gap-2 shadow-2xs transition"
                        >
                            <span>✏️</span> إضافة سكريبت الآن
                        </button>
                    </div>
                `;
            }

            // Sync editor if currently open
            if (state.editorOpen) {
                syncEditorFields(course, scriptText, hasLocalOverride);
            }
        }

        function renderDirButtons() {
            document.querySelectorAll(".dir-btn").forEach(btn => {
                const active = btn.dataset.dir === state.scriptDir;
                if (active) {
                    btn.className = "dir-btn px-2.5 py-1 rounded-lg transition bg-slate-900 text-white";
                } else {
                    btn.className = "dir-btn px-2.5 py-1 rounded-lg transition text-slate-500 hover:text-slate-800";
                }
            });
        }

        function setScriptDir(dir) {
            state.scriptDir = dir;
            try {
                localStorage.setItem(STORAGE_KEY_DIR, dir);
            } catch (e) {}
            const box = document.getElementById("script-text-box");
            if (box) {
                box.setAttribute("dir", dir);
            }
            renderDirButtons();
        }

        function selectCourse(id) {
            state.selectedId = id;
            state.editorOpen = false;
            document.getElementById("editor-card").classList.add("hidden");
            renderSidebarList();
            renderMainView();
            toggleSidebar(false);

            // Ensure selected item stays visible in sidebar
            const activeItem = document.querySelector(`.course-item[data-course-id="${id}"]`);
            if (activeItem) {
                activeItem.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
        }

        function navigateCourse(delta) {
            const filtered = getFilteredCourses();
            const list = filtered.length > 0 ? filtered : COURSES_DATA;
            let idx = list.findIndex(c => c.id === state.selectedId);
            if (idx === -1) idx = 0;
            const nextIdx = idx + delta;
            if (nextIdx >= 0 && nextIdx < list.length) {
                selectCourse(list[nextIdx].id);
            }
        }

        function syncEditorFields(course, scriptText, hasLocalOverride) {
            const textarea = document.getElementById("script-editor-input");
            textarea.value = scriptText;
            updateEditorStats();
            const resetBtn = document.getElementById("reset-script-btn");
            if (hasLocalOverride) {
                resetBtn.classList.remove("hidden");
            } else {
                resetBtn.classList.add("hidden");
            }
        }

        function toggleEditor(forceState) {
            const next = typeof forceState === "boolean" ? forceState : !state.editorOpen;
            state.editorOpen = next;
            const card = document.getElementById("editor-card");

            if (next) {
                const course = COURSES_DATA.find(c => c.id === state.selectedId) || COURSES_DATA[0];
                const scriptText = getEffectiveScript(course);
                const hasLocalOverride = Object.prototype.hasOwnProperty.call(state.localOverrides, course.id);
                syncEditorFields(course, scriptText, hasLocalOverride);
                card.classList.remove("hidden");
                setTimeout(() => document.getElementById("script-editor-input").focus(), 50);
            } else {
                card.classList.add("hidden");
            }
        }

        function updateEditorStats() {
            const val = document.getElementById("script-editor-input").value;
            const s = getStats(val);
            document.getElementById("editor-stats").textContent = `${s.chars} حرف • ${s.words} كلمة`;
        }

        function saveEditedScript() {
            const course = COURSES_DATA.find(c => c.id === state.selectedId) || COURSES_DATA[0];
            const val = document.getElementById("script-editor-input").value;
            state.localOverrides[course.id] = val;
            saveOverrides();
            state.editorOpen = false;
            document.getElementById("editor-card").classList.add("hidden");
            renderAll();
            showToast(`تم حفظ سكريبت ${course.name} ✅`);
        }

        function resetLocalScript() {
            const course = COURSES_DATA.find(c => c.id === state.selectedId) || COURSES_DATA[0];
            delete state.localOverrides[course.id];
            saveOverrides();
            state.editorOpen = false;
            document.getElementById("editor-card").classList.add("hidden");
            renderAll();
            showToast("تم استعادة الحالة الأصلية");
        }

        async function copyCurrentScript(triggerBtn) {
            const course = COURSES_DATA.find(c => c.id === state.selectedId) || COURSES_DATA[0];
            const text = getEffectiveScript(course);

            if (!text.trim()) {
                showToast("لا يوجد سكريبت لنسخه بعد");
                return;
            }

            let copied = false;
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    copied = true;
                } catch (e) {
                    copied = false;
                }
            }

            if (!copied) {
                try {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    ta.setAttribute("readonly", "");
                    ta.style.position = "fixed";
                    ta.style.top = "-9999px";
                    ta.style.left = "-9999px";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, ta.value.length);
                    copied = document.execCommand("copy");
                    document.body.removeChild(ta);
                } catch (e) {
                    copied = false;
                }
            }

            if (copied) {
                showCopySuccessOnButtons(triggerBtn);
                showToast(`تم نسخ سكريبت ${course.name} ✅`);
            } else {
                showToast("تعذر النسخ التلقائي — حدّدي النص واضغطي Ctrl+C");
            }
        }

        function showCopySuccessOnButtons(triggerBtn) {
            const btns = [
                document.getElementById("header-copy-btn"),
                document.getElementById("card-copy-btn")
            ];

            btns.forEach(btn => {
                if (!btn) return;
                const iconEl = btn.querySelector(".copy-icon");
                const labelEl = btn.querySelector(".copy-label");
                if (!btn.dataset.origLabel) btn.dataset.origLabel = labelEl.textContent;
                if (!btn.dataset.origIcon) btn.dataset.origIcon = iconEl.textContent;

                iconEl.textContent = "✅";
                labelEl.textContent = "تم النسخ!";
                btn.classList.add("copied-pop");
                if (btn.id === "header-copy-btn") {
                    btn.classList.remove("bg-orange-600", "hover:bg-orange-500");
                    btn.classList.add("bg-emerald-600", "hover:bg-emerald-500");
                }
            });

            setTimeout(() => {
                btns.forEach(btn => {
                    if (!btn) return;
                    const iconEl = btn.querySelector(".copy-icon");
                    const labelEl = btn.querySelector(".copy-label");
                    iconEl.textContent = btn.dataset.origIcon || "📋";
                    labelEl.textContent = btn.dataset.origLabel || "نسخ";
                    btn.classList.remove("copied-pop");
                    if (btn.id === "header-copy-btn") {
                        btn.classList.remove("bg-emerald-600", "hover:bg-emerald-500");
                        btn.classList.add("bg-orange-600", "hover:bg-orange-500");
                    }
                });
            }, 1800);
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toast-message").textContent = msg;
            toast.classList.remove("opacity-0", "translate-y-4");
            toast.classList.add("opacity-100", "translate-y-0");

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-4");
                toast.classList.remove("opacity-100", "translate-y-0");
            }, 2200);
        }

        function clearSearch() {
            const input = document.getElementById("search-input");
            input.value = "";
            state.search = "";
            document.getElementById("clear-search-btn").classList.add("hidden");
            document.getElementById("clear-search-btn").classList.remove("flex");
            renderSidebarList();
            renderMainView();
            input.focus();
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById("sidebar");
            const backdrop = document.getElementById("mobile-backdrop");
            if (open) {
                sidebar.classList.remove("translate-x-full");
                backdrop.classList.remove("hidden");
            } else {
                sidebar.classList.add("translate-x-full");
                backdrop.classList.add("hidden");
            }
        }

        // Event Listeners
        document.getElementById("search-input").addEventListener("input", e => {
            state.search = e.target.value;
            const clearBtn = document.getElementById("clear-search-btn");
            if (state.search.length > 0) {
                clearBtn.classList.remove("hidden");
                clearBtn.classList.add("flex");
            } else {
                clearBtn.classList.add("hidden");
                clearBtn.classList.remove("flex");
            }
            renderSidebarList();
            renderMainView();
        });

        document.querySelectorAll(".filter-tab").forEach(btn => {
            btn.addEventListener("click", () => {
                state.filter = btn.dataset.filter;
                renderFilterTabs();
                renderSidebarList();

                // If current course isn't in the filtered list and filtered list is non-empty, jump to first match
                const filtered = getFilteredCourses();
                if (filtered.length > 0 && !filtered.some(c => c.id === state.selectedId)) {
                    state.selectedId = filtered[0].id;
                    renderSidebarList();
                }
                renderMainView();
            });
        });

        document.getElementById("script-editor-input").addEventListener("input", updateEditorStats);

        document.addEventListener("keydown", e => {
            const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
            const isTyping = tag === "input" || tag === "textarea" || tag === "select";

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
                e.preventDefault();
                toggleSidebar(true);
                document.getElementById("search-input").focus();
                return;
            }

            if (!isTyping) {
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    navigateCourse(1);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    navigateCourse(-1);
                }
            }
        });

        // Initial render
        renderAll();
    </script>
</body>
</html>
